<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="author" content="Joeprince">
<title>血壓紀錄</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f7de1">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="血壓紀錄">
<style>
  :root{
    --bg:#f4f6f9; --card:#fff; --text:#1f2933; --muted:#6b7785; --line:#dde3ea;
    --accent:#2f7de1; --accent-soft:#e3eefc; --ok:#1f9d55; --warn:#d64545; --key:#ffffff; --key-press:#e6ebf1;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14181d; --card:#1e242b; --text:#e6eaef; --muted:#97a3b0; --line:#323a44;
      --accent:#5a9cf0; --accent-soft:#233548; --key:#262d36; --key-press:#323b46; }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; font-family:-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
    background:var(--bg); color:var(--text)}
  .wrap{max-width:480px; margin:0 auto; padding:12px 16px 32px}
  h1{font-size:20px; margin:4px 0 12px; display:flex; justify-content:space-between; align-items:center}
  .today{font-size:14px; color:var(--muted); font-weight:normal}

  .fields{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px}
  .field{background:var(--card); border:2px solid var(--line); border-radius:12px; padding:8px 4px; text-align:center; cursor:pointer}
  .field.active{border-color:var(--accent); background:var(--accent-soft)}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:4px}
  .field .val{font-size:24px; font-weight:600; min-height:30px; font-variant-numeric:tabular-nums}
  .field .val.placeholder{color:var(--muted); opacity:.5}

  .msg{min-height:20px; font-size:14px; text-align:center; margin-bottom:8px; color:var(--warn)}
  .msg.ok{color:var(--ok)}

  .pad{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; animation:popup .18s ease-out}
  .pad.hidden{display:none}
  @keyframes popup{from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none}}
  .pad button{font-size:26px; padding:14px 0; border:1px solid var(--line); border-radius:12px;
    background:var(--key); color:var(--text); cursor:pointer; font-family:inherit}
  .pad button:active{background:var(--key-press)}
  .pad .plus{color:var(--accent); font-weight:700}
  .pad .cancel{font-size:18px; color:var(--warn)}
  .pad .enter{font-size:18px; background:var(--accent); color:#fff; border-color:var(--accent); grid-column:span 2}
  .pad .enter:active{filter:brightness(.9)}
  .pad .back{font-size:20px}

  .stats{margin:20px 0 0; font-size:15px; font-variant-numeric:tabular-nums;
    display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap}
  .sbtn{padding:4px 10px; font-size:13px; white-space:nowrap}
  .opt{display:flex; align-items:center; gap:8px; font-size:15px; margin-bottom:10px; cursor:pointer}
  .opt input{width:18px; height:18px}
  .stats b{font-weight:600}
  .stats .high{color:var(--warn)}
  .stats .muted{color:var(--muted); font-size:13px}
  .listhead{display:flex; justify-content:space-between; align-items:center; margin:24px 0 8px}
  .listhead h2{font-size:17px; margin:0}
  .btn{border:1px solid var(--accent); background:transparent; color:var(--accent); border-radius:8px;
    padding:6px 12px; font-size:14px; cursor:pointer; font-family:inherit}
  .btn.solid{background:var(--accent); color:#fff}
  .btn.danger{border-color:var(--warn); color:var(--warn)}

  table{width:100%; border-collapse:collapse; background:var(--card); border-radius:12px; overflow:hidden; font-size:15px}
  th,td{padding:9px 4px; text-align:center; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums}
  th{font-size:12px; color:var(--muted); font-weight:normal}
  tr:last-child td{border-bottom:none}
  td.high{color:var(--warn); font-weight:600}
  td .edit{padding:4px 8px; font-size:13px}
  .empty{text-align:center; color:var(--muted); padding:20px; background:var(--card); border-radius:12px; font-size:14px}

  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; padding:16px; z-index:10}
  .modal-bg.show{display:flex}
  .modal{background:var(--card); border-radius:14px; padding:18px; width:100%; max-width:360px}
  .modal h3{margin:0 0 12px; font-size:17px}
  .row{display:flex; align-items:center; gap:10px; margin-bottom:10px}
  .row label{width:64px; font-size:14px; color:var(--muted)}
  .row input{flex:1; font-size:16px; padding:8px; border:1px solid var(--line); border-radius:8px;
    background:var(--bg); color:var(--text); font-family:inherit; min-width:0}
  .row span{color:var(--muted)}
  .actions{display:flex; justify-content:space-between; margin-top:14px; gap:8px}
  .actions div{display:flex; gap:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>血壓紀錄 <span class="today" id="today"></span></h1>

  <div class="fields" id="fields">
    <div class="field" data-i="0"><label>收縮壓</label><div class="val"></div></div>
    <div class="field" data-i="1"><label>舒張壓</label><div class="val"></div></div>
    <div class="field" data-i="2"><label>心跳</label><div class="val"></div></div>
    <div class="field" data-i="3"><label>時間</label><div class="val"></div></div>
  </div>

  <div class="msg" id="msg"></div>

  <div class="pad hidden" id="pad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button data-k="+" class="plus">+</button><button data-k="0">0</button><button data-k="back" class="back">⌫</button>
    <button data-k="cancel" class="cancel">取消</button><button data-k="enter" class="enter">輸入</button>
  </div>

  <div class="stats"><span id="stats"></span><button class="btn sbtn" id="rangeBtn">日期設定</button></div>

  <div class="listhead">
    <h2>紀錄</h2>
    <div style="display:flex; gap:8px">
      <button class="btn" id="limitBtn">標準</button>
      <button class="btn solid" id="exportBtn">輸出檔案 (CSV)</button>
    </div>
  </div>
  <div id="list"></div>
</div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h3>修改紀錄</h3>
    <div class="row"><label>日期</label><input type="date" id="eDate"></div>
    <div class="row"><label>時間</label><input type="time" id="eTime"></div>
    <div class="row"><label>收縮壓</label><input type="number" inputmode="numeric" id="eSys"></div>
    <div class="row"><label>舒張壓</label><input type="number" inputmode="numeric" id="eDia"></div>
    <div class="row"><label>心跳</label><input type="number" inputmode="numeric" id="ePul"></div>
    <div class="actions">
      <button class="btn danger" id="eDel">刪除</button>
      <div><button class="btn" id="eCancel">取消</button><button class="btn solid" id="eSave">儲存</button></div>
    </div>
  </div>
</div>

<div class="modal-bg" id="rModal">
  <div class="modal">
    <h3>統計期間</h3>
    <label class="opt"><input type="radio" name="rmode" value="week"> 最近一週</label>
    <label class="opt"><input type="radio" name="rmode" value="custom"> 自訂日期</label>
    <div class="row"><label>開始日期</label><input type="date" id="rFrom"></div>
    <div class="row"><label>結束日期</label><input type="date" id="rTo"></div>
    <div class="actions">
      <span></span>
      <div><button class="btn" id="rCancel">取消</button><button class="btn solid" id="rOk">確定</button></div>
    </div>
  </div>
</div>

<div class="modal-bg" id="sModal">
  <div class="modal">
    <h3>標準範圍（超出顯示紅色）</h3>
    <div class="row"><label>收縮壓</label><input type="number" inputmode="numeric" id="sSysMin"><span>–</span><input type="number" inputmode="numeric" id="sSysMax"></div>
    <div class="row"><label>舒張壓</label><input type="number" inputmode="numeric" id="sDiaMin"><span>–</span><input type="number" inputmode="numeric" id="sDiaMax"></div>
    <div class="row"><label>心跳</label><input type="number" inputmode="numeric" id="sPulMin"><span>–</span><input type="number" inputmode="numeric" id="sPulMax"></div>
    <div class="actions">
      <button class="btn" id="sReset">恢復預設</button>
      <div><button class="btn" id="sCancel">取消</button><button class="btn solid" id="sOk">確定</button></div>
    </div>
  </div>
</div>

<script>
const KEY = 'bp-records-v1';
const LABELS = ['收縮壓','舒張壓','心跳','時間'];
let vals = ['', '', '', ''];   // 時間存 4 位數字 hhmm
let active = 0;
let records = load();
let editingId = null;
let padOpen = false;
const padEl = document.getElementById('pad');
function showPad(){ padOpen = true; padEl.classList.remove('hidden'); renderFields(); }
function hidePad(){ padOpen = false; padEl.classList.add('hidden'); renderFields(); }

// 標準範圍（存在瀏覽器，下次開啟沿用）
const LKEY = 'bp-limits-v1';
const DEFAULT_LIMITS = { sys:[0,150], dia:[0,110], pul:[0,100] };
let limits = (()=>{ try { return JSON.parse(localStorage.getItem(LKEY)) || DEFAULT_LIMITS; } catch(e){ return DEFAULT_LIMITS; } })();
function saveLimits(){ try { localStorage.setItem(LKEY, JSON.stringify(limits)); } catch(e){} }
const isOut = (k, v) => v < limits[k][0] || v > limits[k][1];

function load(){
  try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch(e){ return []; }
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(records)); } catch(e){}
}
const pad2 = n => String(n).padStart(2,'0');
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function nowHM(){ const d=new Date(); return pad2(d.getHours())+':'+pad2(d.getMinutes()); }
function toYYMMDD(iso){ const [y,m,d]=iso.split('-'); return y.slice(2)+'/'+m+'/'+d; }
function fmtTime(raw){ return raw.length<=2 ? raw : raw.slice(0,2)+':'+raw.slice(2); }

document.getElementById('today').textContent = toYYMMDD(todayISO());

function setMsg(t, ok){ const m=document.getElementById('msg'); m.textContent=t||''; m.className='msg'+(ok?' ok':''); }

function renderFields(){
  document.querySelectorAll('.field').forEach((f,i)=>{
    f.classList.toggle('active', padOpen && i===active);
    const v = f.querySelector('.val');
    if(i===3){
      if(vals[3]){ v.textContent = fmtTime(vals[3]); v.classList.remove('placeholder'); }
      else { v.textContent = nowHM(); v.classList.add('placeholder'); }
    } else {
      v.textContent = vals[i] || '—';
      v.classList.toggle('placeholder', !vals[i]);
    }
  });
}

function press(k){
  setMsg('');
  if(/^\d$/.test(k)){
    const max = active===3 ? 4 : 3;
    if(vals[active].length < max) vals[active] += k;
    // 數值欄位輸入滿 3 位自動跳下一格；時間滿 4 位停留
    // 舒張壓、心跳：第一個數字大於 2 時，輸入 2 位就跳下一格
    if(active<3){
      const v = vals[active];
      const need = (active>=1 && +v[0]>2) ? 2 : 3;
      if(v.length>=need) active++;
    }
  } else if(k==='+'){
    active = (active+1)%4;
  } else if(k==='back'){
    vals[active] = vals[active].slice(0,-1);
  } else if(k==='cancel'){
    vals=['','','','']; active=0;
  } else if(k==='enter'){
    submit(); return;
  }
  renderFields();
}

function submit(){
  const [s,d,p,t] = vals;
  for(let i=0;i<3;i++){
    if(!vals[i]){ active=i; renderFields(); setMsg('請輸入'+LABELS[i]); return; }
  }
  let time = nowHM();
  if(t){
    if(t.length!==4){ active=3; renderFields(); setMsg('時間請輸入 4 位數 (hhmm)'); return; }
    const hh=+t.slice(0,2), mm=+t.slice(2);
    if(hh>23||mm>59){ active=3; renderFields(); setMsg('時間不正確'); return; }
    time = fmtTime(t);
  }
  records.push({ id:Date.now()+''+Math.random().toString(36).slice(2,6), date:todayISO(), time, sys:+s, dia:+d, pul:+p });
  save();
  vals=['','','','']; active=0;
  hidePad(); renderList();
  setMsg('');
}

function sorted(){
  return [...records].sort((a,b)=> (b.date+b.time).localeCompare(a.date+a.time));
}

// 統計期間：每次開啟固定為最近一週（不儲存）
let statRange = { mode:'week' };
function isoDaysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n);
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function getRange(){
  return statRange.mode==='week' ? { from:isoDaysAgo(6), to:todayISO() }
                                 : { from:statRange.from, to:statRange.to };
}

function renderStats(){
  const {from, to} = getRange();
  const md = iso => iso.slice(5).replace('-','/');
  const range = md(from) + '-' + md(to);
  const recent = records.filter(r => r.date >= from && r.date <= to);
  const box = document.getElementById('stats');
  if(!recent.length){ box.innerHTML = `${range}：<span class="muted">無資料</span>`; return; }
  const avg = k => recent.reduce((s,r)=>s+r[k],0)/recent.length;
  const s=avg('sys'), di=avg('dia'), p=avg('pul');
  const b = (v, high) => `<b class="${high?'high':''}">${v.toFixed(0)}</b>`;
  box.innerHTML = `${range}：收縮壓 ${b(s,isOut('sys',s))}　舒張壓 ${b(di,isOut('dia',di))}　心跳 ${b(p,isOut('pul',p))}`;
}

function renderList(){
  renderStats();
  const box = document.getElementById('list');
  if(!records.length){ box.innerHTML='<div class="empty">尚無紀錄</div>'; return; }
  let h='<table><thead><tr><th>日期</th><th>時間</th><th>收縮壓</th><th>舒張壓</th><th>心跳</th><th></th></tr></thead><tbody>';
  for(const r of sorted()){
    h+=`<tr><td>${toYYMMDD(r.date)}</td><td>${r.time}</td>
      <td class="${isOut('sys',r.sys)?'high':''}">${r.sys}</td>
      <td class="${isOut('dia',r.dia)?'high':''}">${r.dia}</td>
      <td class="${isOut('pul',r.pul)?'high':''}">${r.pul}</td>
      <td><button class="btn edit" data-id="${r.id}">修改</button></td></tr>`;
  }
  box.innerHTML = h+'</tbody></table>';
}

// 修改視窗
const modal = document.getElementById('modal');
function openEdit(id){
  const r = records.find(x=>x.id===id); if(!r) return;
  editingId=id;
  eDate.value=r.date; eTime.value=r.time; eSys.value=r.sys; eDia.value=r.dia; ePul.value=r.pul;
  modal.classList.add('show');
}
function closeEdit(){ modal.classList.remove('show'); editingId=null; }
document.getElementById('eCancel').onclick = closeEdit;
modal.addEventListener('click', e=>{ if(e.target===modal) closeEdit(); });
document.getElementById('eSave').onclick = ()=>{
  const r = records.find(x=>x.id===editingId); if(!r) return;
  if(!eDate.value || !eTime.value || !eSys.value || !eDia.value || !ePul.value){ alert('請填完所有欄位'); return; }
  r.date=eDate.value; r.time=eTime.value.slice(0,5); r.sys=+eSys.value; r.dia=+eDia.value; r.pul=+ePul.value;
  save(); renderList(); closeEdit();
};
document.getElementById('eDel').onclick = ()=>{
  if(!confirm('確定刪除這筆紀錄？')) return;
  records = records.filter(x=>x.id!==editingId);
  save(); renderList(); closeEdit();
};

// 日期設定視窗
const rModal = document.getElementById('rModal');
const rFrom = document.getElementById('rFrom'), rTo = document.getElementById('rTo');
const radio = v => document.querySelector(`input[name="rmode"][value="${v}"]`);
document.getElementById('rangeBtn').onclick = ()=>{
  const {from, to} = getRange();
  radio(statRange.mode).checked = true;
  rFrom.value = from; rTo.value = to;
  rModal.classList.add('show');
};
[rFrom, rTo].forEach(el => el.addEventListener('input', ()=> radio('custom').checked = true));
document.getElementById('rCancel').onclick = ()=> rModal.classList.remove('show');
rModal.addEventListener('click', e=>{ if(e.target===rModal) rModal.classList.remove('show'); });
document.getElementById('rOk').onclick = ()=>{
  if(radio('week').checked){
    statRange = { mode:'week' };
  } else {
    if(!rFrom.value || !rTo.value){ alert('請選擇開始和結束日期'); return; }
    let f=rFrom.value, t=rTo.value;
    if(f>t) [f,t]=[t,f];
    statRange = { mode:'custom', from:f, to:t };
  }
  rModal.classList.remove('show');
  renderStats();
};

// 標準設定視窗
const sModal = document.getElementById('sModal');
const sIds = { sys:['sSysMin','sSysMax'], dia:['sDiaMin','sDiaMax'], pul:['sPulMin','sPulMax'] };
function fillLimits(L){ for(const k in sIds){ document.getElementById(sIds[k][0]).value=L[k][0]; document.getElementById(sIds[k][1]).value=L[k][1]; } }
document.getElementById('limitBtn').onclick = ()=>{ fillLimits(limits); sModal.classList.add('show'); };
document.getElementById('sReset').onclick = ()=> fillLimits(DEFAULT_LIMITS);
document.getElementById('sCancel').onclick = ()=> sModal.classList.remove('show');
sModal.addEventListener('click', e=>{ if(e.target===sModal) sModal.classList.remove('show'); });
document.getElementById('sOk').onclick = ()=>{
  const L = {};
  for(const k in sIds){
    const a = document.getElementById(sIds[k][0]).value, b = document.getElementById(sIds[k][1]).value;
    if(a==='' || b===''){ alert('請填完所有欄位'); return; }
    L[k] = +a <= +b ? [+a,+b] : [+b,+a];
  }
  limits = L; saveLimits();
  sModal.classList.remove('show');
  renderList();
};

// 輸出 CSV（UTF-8 含 BOM，LibreOffice Calc 可直接開啟）
document.getElementById('exportBtn').onclick = ()=>{
  if(!records.length){ alert('沒有資料可輸出'); return; }
  const rows = [['日期','時間','收縮壓','舒張壓','心跳']];
  for(const r of [...records].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)))
    rows.push([toYYMMDD(r.date), r.time, r.sys, r.dia, r.pul]);
  const csv = '\ufeff' + rows.map(r=>r.join(',')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '血壓紀錄_'+todayISO().replace(/-/g,'')+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
};

// 事件
document.getElementById('pad').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(b) press(b.dataset.k);
});
document.getElementById('fields').addEventListener('click', e=>{
  const f = e.target.closest('.field'); if(f){ active=+f.dataset.i; showPad(); }
});
document.getElementById('list').addEventListener('click', e=>{
  const b = e.target.closest('.edit'); if(b) openEdit(b.dataset.id);
});
// 實體鍵盤也可用
document.addEventListener('keydown', e=>{
  if(document.querySelector('.modal-bg.show')) return;
  if(!padOpen && /^(\d|\+|Tab|Enter|Backspace)$/.test(e.key)) showPad();
  if(/^\d$/.test(e.key)) press(e.key);
  else if(e.key==='+'||e.key==='Tab'){ e.preventDefault(); press('+'); }
  else if(e.key==='Backspace') press('back');
  else if(e.key==='Enter') press('enter');
  else if(e.key==='Escape') press('cancel');
});
setInterval(()=>{ if(!vals[3]) renderFields(); }, 30000);

renderFields(); renderList();
// 離線可用
if('serviceWorker' in navigator){ window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
</body>
</html>
